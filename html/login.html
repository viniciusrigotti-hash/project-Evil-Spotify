<!-- Log In -->
<!DOCTYPE html>
<html lang="pt-BR">
<!-- Head -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Links -->
        <!-- JS -->
    <script type="module" src="/js/login.js" defer></script>
        <!-- CSS -->
    <link rel="stylesheet" href="/css/login.css">
        <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
        <!-- Icon -->
    <link rel="icon" href="/images/Evil Spotify Icon.png">
        <!-- FontAwesome -->
    <script src="https://kit.fontawesome.com/c95e6303ed.js" crossorigin="anonymous"></script>
    <!-- Título -->
    <title>Log in - Evil Spotify</title>
</head>
<!-- Body -->
<body>
    <!-- Main -->
    <main>
        <div id="mainDiv">
            <h1>Entre com sua conta.</h1>
            <form id="loginForm">
                <div class="loginEntry">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Digite seu email" class="loginInput" required>
                </div>

                <div class="loginEntry">
                    <label for="password">Senha</label>
                    <input type="password" name="password" id="password" placeholder="Digite sua senha" class="loginInput" required>
                </div>
                
                <div class="loginEntry">
                    <label for="confirmPassword">Confirme sua senha.</label>
                    <input type="confirmPassword" name="confirmPassword" id="confirmPassword" placeholder="Digite sua senha novamente" class="loginInput" required>
                </div>

                <button id="submit">Entrar</button>

                <p>Ainda não possui uma conta?</p>
                <a href="./signin.html">Crie uma agora!</a>
            </form>
        </div>
    </main>
</body>
</html>
